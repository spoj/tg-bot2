name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4        # reads pnpm@11.17.0 from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22                # latest 22.x, satisfies engines >=22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
